name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (package.json "engines") through current LTS.
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The terminal tests run the real manager with stub tailscale/ssh
      # binaries and need python3 for the pseudo-terminal; both ship with
      # ubuntu-latest.
      - run: npm test
